name: uzhavan-ai
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - torchaudio>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1
  - cudatoolkit=12.1
  - numpy>=1.24.0
  - scipy>=1.11.0
  - pandas>=2.1.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - scikit-learn>=1.3.0
  - pillow>=10.0.0
  - tqdm>=4.66.0
  - pyyaml>=6.0.0
  - requests>=2.31.0
  - flask>=3.0.0
  - pip:
    - -r requirements.txt
