# ============================================
# 🌾 UZHAVAN AI - Crop Disease Model Config
# Plant Disease Classification (EfficientNet)
# ============================================

model:
  name: "efficientnet_b0"  # efficientnet_b0 | resnet50 | mobilenet_v3
  pretrained: true
  num_classes: 38  # PlantVillage has 38 classes
  dropout: 0.3
  freeze_backbone_epochs: 3  # Freeze backbone for first N epochs

training:
  epochs: 30
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  mixed_precision: true
  gradient_accumulation_steps: 1
  
  save_best_model: true
  checkpoint_dir: "models/crop_disease/checkpoints"
  best_model_path: "models/crop_disease/best_crop_model.pt"
  
  early_stopping: true
  early_stopping_patience: 7
  early_stopping_metric: "accuracy"
  early_stopping_mode: "max"
  
  log_dir: "results/crop_disease/tensorboard"

data:
  dataset_source: "huggingface"  # huggingface | kaggle | local
  dataset_name: "mohanty/PlantVillage"
  dataset_config: "default"
  image_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  num_workers: 4
  pin_memory: true
  
  augmentation:
    random_horizontal_flip: true
    random_rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
    random_resized_crop:
      scale: [0.8, 1.0]

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "top_3_accuracy"
  confusion_matrix: true
  per_class_metrics: true
  results_dir: "results/crop_disease"
  
# Tamil crop name mappings
crop_names_tamil:
  "Apple": "ஆப்பிள்"
  "Corn": "சோளம்"
  "Grape": "திராட்சை"
  "Pepper": "மிளகாய்"
  "Potato": "உருளைக்கிழங்கு"
  "Rice": "நெல்"
  "Tomato": "தக்காளி"
  "Wheat": "கோதுமை"
